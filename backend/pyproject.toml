[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operations-assistant-backend"
version = "1.0.0"
description = "AI Operations Assistant Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",
    "pypdf>=4.1.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "google-genai>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
